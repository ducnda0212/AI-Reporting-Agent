[project]
name = "pmo-reporting-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.32", "pydantic>=2.9", "pydantic-settings>=2.5",
  "sqlalchemy>=2.0", "charset-normalizer>=3.5", "python-dateutil>=2.9",
  "openpyxl>=3.1.5", "python-multipart>=0.0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
